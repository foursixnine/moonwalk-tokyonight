name: Release Gem

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    if: github.repository == 'foursixnine/moonwalk-tokyonight'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build and push gem
        run: |
          gem build moonwalk-tokyonight.gemspec
          gem push moonwalk-tokyonight-*.gem
